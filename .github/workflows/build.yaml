name: Build

on:
  push:
    branches: [main]
  pull_request:
    paths: ["hermes/**", ".github/workflows/build.yaml"]

permissions:
  contents: read

jobs:
  # On main: maintains the release PR; merging it bumps hermes/config.yaml,
  # writes hermes/CHANGELOG.md and creates the release.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.releases_created }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # Pull requests build only; a release publishes `<version>` and `latest`.
  build:
    needs: release
    if: always() && (github.event_name == 'pull_request' || needs.release.outputs.created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./hermes

      - id: version
        run: echo "version=$(yq '.version' hermes/config.yaml)" >> "$GITHUB_OUTPUT"

      # ponytail: arm64 via QEMU, fine since the Dockerfile only adds nginx.
      # Move to native arm runners + manifest merge if the build gets heavy.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./hermes
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.release.outputs.created == 'true' }}
          tags: |
            ghcr.io/alexandrevilain/ha-hermes-addon:${{ steps.version.outputs.version }}
            ghcr.io/alexandrevilain/ha-hermes-addon:latest
          labels: |
            io.hass.type=app
            io.hass.name=Hermes Agent
            io.hass.version=${{ steps.version.outputs.version }}
