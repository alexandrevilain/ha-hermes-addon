# The server for port 9119 (remote access). cont-init.d/016-direct-access links
# this file into /run/nginx-direct, and nginx.conf includes it in its http block.

# X-Forwarded-Proto tells Hermes if the visitor uses HTTPS. Hermes needs it to
# mark its cookies as Secure.
# A proxy app (Cloudflared...) handles HTTPS itself and talks to us in plain
# HTTP, so we keep the scheme it sends. We only trust apps on the hassio network
# (172.30.32.0/23). For any other client, we send our own scheme.
# $realip_remote_addr is the real TCP client, before set_real_ip_from below
# replaces $remote_addr with the X-Forwarded-For value.
geo $realip_remote_addr $proxy_app {
    default         0;
    172.30.32.0/23  1;
}
map "$proxy_app:$http_x_forwarded_proto" $forwarded_proto {
    ~^1:(?<proto>https?)$  $proto;
    default                $scheme;
}

# Port 9119 leads to the same dashboard as the sidebar. Hermes only accepts
# requests for the host of its public URL. Setting the public URL also turns
# Hermes' login on, for the sidebar too.
server {
    # A link to listen-http.conf, or to listen-https.conf when "ssl" is on.
    include /run/nginx-direct/listen;

    # Proxy apps send the visitor's IP in X-Forwarded-For: log and pass that IP,
    # not the proxy's.
    set_real_ip_from 172.30.32.0/23;
    real_ip_header X-Forwarded-For;

    # Without a public URL, Hermes has no login and only accepts loopback hosts
    # (the sidebar sends one). Refuse these hosts here, so nobody can use 9119
    # to reach the dashboard without a login.
    if ($host ~* ^(localhost|127\.0\.0\.1|\[::1\])$) {
        return 421;
    }

    location / {
        proxy_pass http://127.0.0.1:9120;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Send $host, the host checked above, not $http_host.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Prefix "";
        # Hermes trusts these headers from nginx. Clear them, so a client cannot
        # send another host than the one checked above.
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
