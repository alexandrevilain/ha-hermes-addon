# Port 9119 over TLS with Home Assistant's certificate, used when "ssl" is on.
# cont-init.d/016-direct-access links this file into /run/nginx-direct, and
# links cert.pem and key.pem there to the files chosen in /ssl.
listen 9119 ssl;
ssl_certificate /run/nginx-direct/cert.pem;
ssl_certificate_key /run/nginx-direct/key.pem;
