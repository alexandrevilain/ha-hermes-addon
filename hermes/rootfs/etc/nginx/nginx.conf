user www-data;
error_log stderr warn;

events {}

http {
    access_log off;
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099;

        # Only the Home Assistant ingress gateway (and in-container curl).
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:9120;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # The dashboard only accepts its bound host (DNS-rebinding guard).
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Origin http://127.0.0.1;
            # Hermes rewrites its SPA URLs under the ingress prefix.
            proxy_set_header X-Forwarded-Prefix $http_x_ingress_path;
            # Hermes builds its redirect URLs from these headers. The Supervisor
            # sends Home Assistant's host, not ours, so clear them. direct.conf
            # does the same.
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header Forwarded "";
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }

    # Port 9119, for remote access (direct.conf). cont-init.d/016-direct-access
    # links it here, except when "ssl" is on and a certificate file is missing:
    # the folder is then empty and the port stays closed.
    include /run/nginx-direct/*.conf;
}
